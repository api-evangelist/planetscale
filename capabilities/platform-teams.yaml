naftiko: 1.0.0-alpha2
info:
  label: PlanetScale Platform API — Teams
  description: 'PlanetScale Platform API — Teams. 5 operations. Lead operation: List teams. Self-contained Naftiko capability
    covering one Planetscale business surface.'
  tags:
  - Planetscale
  - Teams
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PLANETSCALE_API_KEY: PLANETSCALE_API_KEY
capability:
  consumes:
  - type: http
    namespace: platform-teams
    baseUri: https://api.planetscale.com/v1
    description: PlanetScale Platform API — Teams business capability. Self-contained, no shared references.
    resources:
    - name: organizations-organization-teams
      path: /organizations/{organization}/teams
      operations:
      - name: listteams
        method: GET
        description: List teams
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createteam
        method: POST
        description: Create a team
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: organizations-organization-teams-team_slug
      path: /organizations/{organization}/teams/{team_slug}
      operations:
      - name: getteam
        method: GET
        description: Get a team
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updateteam
        method: PATCH
        description: Update a team
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deleteteam
        method: DELETE
        description: Delete a team
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.PLANETSCALE_API_KEY}}'
  exposes:
  - type: rest
    namespace: platform-teams-rest
    port: 8080
    description: REST adapter for PlanetScale Platform API — Teams. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/organizations/{organization}/teams
      name: organizations-organization-teams
      description: REST surface for organizations-organization-teams.
      operations:
      - method: GET
        name: listteams
        description: List teams
        call: platform-teams.listteams
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createteam
        description: Create a team
        call: platform-teams.createteam
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/organizations/{organization}/teams/{team-slug}
      name: organizations-organization-teams-team-slug
      description: REST surface for organizations-organization-teams-team_slug.
      operations:
      - method: GET
        name: getteam
        description: Get a team
        call: platform-teams.getteam
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: updateteam
        description: Update a team
        call: platform-teams.updateteam
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteteam
        description: Delete a team
        call: platform-teams.deleteteam
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: platform-teams-mcp
    port: 9090
    transport: http
    description: MCP adapter for PlanetScale Platform API — Teams. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-teams
      description: List teams
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: platform-teams.listteams
      outputParameters:
      - type: object
        mapping: $.
    - name: create-team
      description: Create a team
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: platform-teams.createteam
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-team
      description: Get a team
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: platform-teams.getteam
      outputParameters:
      - type: object
        mapping: $.
    - name: update-team
      description: Update a team
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: platform-teams.updateteam
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-team
      description: Delete a team
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: platform-teams.deleteteam
      outputParameters:
      - type: object
        mapping: $.
