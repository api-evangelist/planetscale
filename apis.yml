  humanURL: https://planetscale.com/docs/api/planetscale-api-oauth-applications
  properties:
  - url: https://planetscale.com/docs/api/planetscale-api-oauth-applications
    type: Documentation
  description: >-
    PlanetScale OAuth allows developers to create OAuth applications that can access users' PlanetScale
    accounts on their behalf. The implementation supports the Authorization Code grant type, enabling
    third-party applications to authenticate users and obtain delegated access to PlanetScale resources.
    This is particularly useful for building integrations and tools that need to interact with organization-level
    PlanetScale endpoints on behalf of multiple users.
- aid: planetscale:serverless-driver
  name: PlanetScale Serverless Driver for JavaScript
  tags:
  - Driver
  - Edge Computing
  - JavaScript
  - MySQL
  - SDK
  - Serverless
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.example.com
  humanURL: https://planetscale.com/docs/tutorials/using-the-serverless-driver
  properties:
  - url: https://planetscale.com/docs/tutorials/using-the-serverless-driver
    type: Documentation
  description: >-
    The PlanetScale Serverless Driver for JavaScript is a Fetch API-compatible database driver designed
    for serverless and edge compute platforms such as Cloudflare Workers, Vercel Edge Functions, and Netlify
    Edge Functions. It enables developers to query PlanetScale databases over HTTP connections, bypassing
    the TCP restrictions common in edge environments.
- aid: planetscale:cli
  name: PlanetScale CLI
  tags:
  - CLI
  - Command Line
  - Database Management
  - Developer Tools
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.example.com
  humanURL: https://planetscale.com/docs/reference/planetscale-cli
  properties:
  - url: https://planetscale.com/docs/reference/planetscale-cli
    type: Documentation
  description: >-
    The PlanetScale CLI (pscale) is a command-line tool that brings PlanetScale database management to
    the terminal. It allows developers to create, delete, and list databases and branches, open interactive
    MySQL shells for database branches, and manage deploy requests directly from the command line. The
    CLI is available via Homebrew and as a downloadable binary, and includes a Model Context Protocol
    (MCP) server that provides AI tools with direct access to PlanetScale databases.
